name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to update."
        required: true
      keycloak_versions:
        description: "Use 'latest-5' or a comma-separated version list."
        required: false
        default: "latest-5"

jobs:
  resolve:
    name: Resolve Keycloak versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions_json: ${{ steps.keycloak.outputs.versions_json }}
      selector: ${{ steps.keycloak.outputs.selector }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: release
        env:
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          release_tag="${EVENT_RELEASE_TAG:-$INPUT_RELEASE_TAG}"
          if [ -z "$release_tag" ]; then
            echo "Missing release tag." >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $release_tag"

      - name: Resolve build matrix
        id: keycloak
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_KEYCLOAK_VERSIONS: ${{ github.event.inputs.keycloak_versions || 'latest-5' }}
        run: |
          set -euo pipefail
          selector="$INPUT_KEYCLOAK_VERSIONS"
          versions_json="$(./scripts/resolve-keycloak-versions.sh "$selector" --json)"

          echo "selector=$selector" >> "$GITHUB_OUTPUT"
          echo "versions_json=$versions_json" >> "$GITHUB_OUTPUT"

          echo "Keycloak selector: $selector"
          echo "Keycloak versions: $versions_json"

  build:
    name: Build Keycloak ${{ matrix.keycloak_version }} release asset
    runs-on: ubuntu-latest
    needs:
      - resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        keycloak_version: ${{ fromJSON(needs.resolve.outputs.versions_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate theme structure
        run: ./scripts/validate-theme.sh

      - name: Build ready-to-use JAR
        env:
          KEYCLOAK_VERSION: ${{ matrix.keycloak_version }}
        run: ./scripts/package-theme.sh

      - name: Validate Docker image
        run: docker build --build-arg KEYCLOAK_VERSION="${{ matrix.keycloak_version }}" -t ai-innovation-keycloak-theme:${{ matrix.keycloak_version }} .

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          cp "build/ai-innovation-keycloak-theme-${{ matrix.keycloak_version }}.jar" build/release-assets/

      - name: Upload intermediate assets
        uses: actions/upload-artifact@v7
        with:
          name: ai-innovation-keycloak-theme-${{ matrix.keycloak_version }}
          path: build/release-assets/*.jar
          if-no-files-found: error

  publish:
    name: Attach assets to GitHub release
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build
    permissions:
      contents: write

    steps:
      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          pattern: ai-innovation-keycloak-theme-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          find release-assets -type f -name '*.jar' -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-assets/SHA256SUMS

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/*.jar release-assets/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
