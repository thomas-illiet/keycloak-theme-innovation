theme.ai-innovation.email.description=AI Innovation email theme.

emailVerificationSubject=Verify your AI Innovation email
emailVerificationBody=Someone created an AI Innovation account with this email address. If this was you, open the verification link below.\n\n{0}\n\nThis link expires within {3}.\n\nIf this was not you, ignore this message.
emailVerificationBodyHtml=<p>Someone created an AI Innovation account with this email address. If this was you, open the verification link below.</p><p><a class="ai-mail-button" href="{0}"><span aria-hidden="true" style="display:inline-block;margin-right:8px;font-weight:800;">&#8594;</span>Verify email</a></p><p>This link expires within {3}.</p><p>If this was not you, ignore this message.</p>
passwordResetSubject=Reset your AI Innovation access
passwordResetBody=A request was made to change credentials for your AI Innovation account. If this was you, open the link below.\n\n{0}\n\nThis link expires within {3}.\n\nIf this was not you, no action is required.
passwordResetBodyHtml=<p>A request was made to change credentials for your AI Innovation account. If this was you, open the link below.</p><p><a class="ai-mail-button" href="{0}"><span aria-hidden="true" style="display:inline-block;margin-right:8px;font-weight:800;">&#8594;</span>Reset access</a></p><p>This link expires within {3}.</p><p>If this was not you, no action is required.</p>
executeActionsSubject=Update your AI Innovation account
executeActionsBody=An administrator requested updates on your AI Innovation account: {3}. Start here:\n\n{0}\n\nThis link expires within {4}.
